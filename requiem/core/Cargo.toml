[package]
name = "requiem-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query"] }
flate2 = "1.1.10"
futures-util = "0.3.34"
log = "0.4.34"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "gzip", "system-proxy", "http2", "charset", "query"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "process", "fs", "io-util", "sync", "time", "macros", "net"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "cors"] }
unicode-normalization = "0.1.26"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
